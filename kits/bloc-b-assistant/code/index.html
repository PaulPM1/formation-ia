<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brief du jour</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <p>Assistant à mémoire</p>
        <h1>Brief du jour</h1>
        <label for="sort">Trier les cartes</label>
        <select id="sort" data-sort>
          <option value="priority">Par priorité</option>
          <option value="title">Par titre</option>
        </select>
      </header>
      <section class="brief-grid" data-brief aria-label="Six notes du brief"></section>
      <noscript>
        <p>Activez JavaScript pour trier les six cartes. Les données restent disponibles dans <code>brief.mjs</code>.</p>
      </noscript>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
